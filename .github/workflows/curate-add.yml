name: Add a link to the curation queue

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Content URL (YouTube / TikTok / Instagram / Bandcamp)"
        required: true
      tags:
        description: "Comma-separated tags (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch oEmbed metadata and add to pending-review.json
        run: node curate-add.js "${{ inputs.url }}" "${{ inputs.tags }}"

      - name: Commit changes
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add pending-review.json
          git commit -m "Curate: add ${{ inputs.url }}"
          git push
