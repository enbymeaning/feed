name: Pull YouTube uploads

on:
  schedule:
    - cron: "0 13 * * *"   # daily at 13:00 UTC — adjust to taste
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull new uploads into pending-review.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node pull-youtube.js

      - name: Commit changes if any
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add pending-review.json
          git diff --cached --quiet || git commit -m "Auto-pull: new YouTube uploads"
          git push
